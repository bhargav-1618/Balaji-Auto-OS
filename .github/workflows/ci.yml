name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (skipped automatically if no "lint" script is defined)
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
